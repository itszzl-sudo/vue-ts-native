<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vue-ts-native Canvas 2D 验证</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
      color: #fff;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #4fc3f7;
    }
    .canvas-container {
      width: 800px;
      margin: 0 auto;
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    canvas {
      display: block;
      width: 100%;
      border-radius: 8px;
      background: #f5f5f5;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    button {
      padding: 10px 20px;
      background: #4fc3f7;
      border: none;
      border-radius: 6px;
      color: #1a1a2e;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #29b6f6;
      transform: translateY(-2px);
    }
    .info {
      margin-top: 15px;
      padding: 10px;
      background: rgba(79, 195, 247, 0.1);
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>vue-ts-native Canvas 2D 布局验证</h1>
  
  <div class="canvas-container">
    <canvas id="test-canvas" width="760" height="600"></canvas>
    
    <div class="controls">
      <button onclick="renderTest1()">基础布局测试</button>
      <button onclick="renderTest2()">样式测试</button>
      <button onclick="renderTest3()">文本测试</button>
      <button onclick="renderDebug()">调试模式</button>
    </div>
    
    <div class="info" id="info">
      点击按钮测试不同渲染效果
    </div>
  </div>

  <script type="module">
    // 模拟 NativeCanvasNode 结构（实际应从 render-adapter 导入）
    // 这里直接用 JS 对象模拟，因为浏览器无法直接 import TS 模块

    const canvas = document.getElementById('test-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    
    // 设置高 DPI
    canvas.width = canvas.offsetWidth * dpr;
    canvas.height = 600 * dpr;
    ctx.scale(dpr, dpr);

    // 简易渲染器
    function renderNode(node, depth = 0) {
      const { x, y, width, height } = node.layoutRect;
      
      if (width === 0 || height === 0) return;
      
      ctx.save();
      
      // 绘制背景
      if (node.style.backgroundColor) {
        ctx.fillStyle = node.style.backgroundColor;
        ctx.fillRect(x, y, width, height);
      }
      
      // 绘制边框
      const borderWidth = Number(node.style.borderWidth) || 0;
      if (borderWidth > 0) {
        ctx.strokeStyle = node.style.borderColor || '#000';
        ctx.lineWidth = borderWidth;
        const radius = Number(node.style.borderRadius) || 0;
        if (radius > 0) {
          drawRoundRect(ctx, x, y, width, height, radius);
          ctx.stroke();
        } else {
          ctx.strokeRect(x, y, width, height);
        }
      }
      
      // 绘制圆角背景
      const borderRadius = Number(node.style.borderRadius) || 0;
      if (borderRadius > 0 && node.style.backgroundColor) {
        ctx.fillStyle = node.style.backgroundColor;
        drawRoundRect(ctx, x, y, width, height, borderRadius);
        ctx.fill();
      }
      
      // 调试模式
      if (node.extend?.debug) {
        ctx.strokeStyle = '#00ff00';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, width, height);
      }
      
      ctx.restore();
      
      // 渲染文本子节点
      if (node.children) {
        node.children.forEach(child => {
          if (child.nodeType === 'text' && child.textContent) {
            renderText(child, node);
          } else {
            renderNode(child, depth + 1);
          }
        });
      }
    }

    function renderText(textNode, parentNode) {
      const { x, y, width } = parentNode.layoutRect;
      const style = parentNode.style;
      
      ctx.save();
      ctx.font = `${style.fontWeight || 'normal'} ${style.fontSize || 14}px ${style.fontFamily || 'system-ui'}`;
      ctx.fillStyle = style.color || '#000';
      ctx.textAlign = style.textAlign || 'left';
      ctx.textBaseline = 'top';
      
      let textX = x;
      if (ctx.textAlign === 'center') textX = x + width / 2;
      else if (ctx.textAlign === 'right') textX = x + width;
      
      ctx.fillText(textNode.textContent, textX, y + 4, width);
      ctx.restore();
    }

    function drawRoundRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.offsetWidth, 600);
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(0, 0, canvas.offsetWidth, 600);
    }

    // 测试 1: 基础布局
    window.renderTest1 = function() {
      clearCanvas();
      
      const rootNode = {
        nodeType: 'element',
        tag: 'view',
        style: { backgroundColor: '#e3f2fd' },
        layoutRect: { x: 20, y: 20, width: 720, height: 560 },
        children: [
          {
            nodeType: 'element',
            tag: 'view',
            style: { backgroundColor: '#1e88e5' },
            layoutRect: { x: 40, y: 40, width: 200, height: 150 },
            children: [
              {
                nodeType: 'text',
                textContent: '蓝色容器',
                layoutRect: { x: 0, y: 0, width: 0, height: 0 }
              }
            ]
          },
          {
            nodeType: 'element',
            tag: 'view',
            style: { backgroundColor: '#43a047', borderRadius: '12' },
            layoutRect: { x: 260, y: 40, width: 200, height: 150 },
            children: [
              {
                nodeType: 'text',
                textContent: '绿色圆角',
                layoutRect: { x: 0, y: 0, width: 0, height: 0 }
              }
            ]
          },
          {
            nodeType: 'element',
            tag: 'view',
            style: { backgroundColor: '#e53935' },
            layoutRect: { x: 480, y: 40, width: 200, height: 150 },
            children: []
          }
        ]
      };
      
      renderNode(rootNode);
      document.getElementById('info').textContent = '基础布局测试：三个不同颜色的容器';
    };

    // 测试 2: 样式测试
    window.renderTest2 = function() {
      clearCanvas();
      
      const rootNode = {
        nodeType: 'element',
        tag: 'view',
        style: { backgroundColor: '#fff' },
        layoutRect: { x: 20, y: 20, width: 720, height: 560 },
        children: [
          {
            nodeType: 'element',
            tag: 'view',
            style: { 
              backgroundColor: '#9c27b0',
              borderRadius: '20',
              borderWidth: '3',
              borderColor: '#4a148c'
            },
            layoutRect: { x: 40, y: 40, width: 300, height: 200 },
            children: [
              {
                nodeType: 'text',
                textContent: '圆角 + 边框',
                layoutRect: { x: 0, y: 0, width: 0, height: 0 }
              }
            ]
          },
          {
            nodeType: 'element',
            tag: 'view',
            style: { 
              backgroundColor: '#ff9800',
              borderRadius: '50'
            },
            layoutRect: { x: 380, y: 40, width: 200, height: 200 },
            children: [
              {
                nodeType: 'text',
                textContent: '圆形',
                layoutRect: { x: 0, y: 0, width: 0, height: 0 }
              }
            ]
          }
        ]
      };
      
      renderNode(rootNode);
      document.getElementById('info').textContent = '样式测试：圆角、边框效果';
    };

    // 测试 3: 文本测试
    window.renderTest3 = function() {
      clearCanvas();
      
      const rootNode = {
        nodeType: 'element',
        tag: 'view',
        style: { backgroundColor: '#fff' },
        layoutRect: { x: 20, y: 20, width: 720, height: 560 },
        children: [
          {
            nodeType: 'element',
            tag: 'text-container',
            style: { 
              backgroundColor: '#e8f5e9',
              fontSize: '24',
              fontWeight: 'bold',
              color: '#2e7d32'
            },
            layoutRect: { x: 40, y: 40, width: 680, height: 60 },
            children: [
              {
                nodeType: 'text',
                textContent: '大号粗体文本',
                layoutRect: { x: 0, y: 0, width: 0, height: 0 }
              }
            ]
          },
          {
            nodeType: 'element',
            tag: 'text-container',
            style: { 
              backgroundColor: '#e3f2fd',
              fontSize: '16',
              color: '#1565c0',
              textAlign: 'center'
            },
            layoutRect: { x: 40, y: 120, width: 680, height: 40 },
            children: [
              {
                nodeType: 'text',
                textContent: '居中文本',
                layoutRect: { x: 0, y: 0, width: 0, height: 0 }
              }
            ]
          }
        ]
      };
      
      renderNode(rootNode);
      document.getElementById('info').textContent = '文本测试：字体大小、粗细、对齐';
    };

    // 调试模式
    window.renderDebug = function() {
      clearCanvas();
      
      const rootNode = {
        nodeType: 'element',
        tag: 'view',
        style: { backgroundColor: '#fff' },
        extend: { debug: true },
        layoutRect: { x: 20, y: 20, width: 720, height: 560 },
        children: [
          {
            nodeType: 'element',
            tag: 'view',
            style: { backgroundColor: '#f44336' },
            extend: { debug: true },
            layoutRect: { x: 40, y: 40, width: 200, height: 150 },
            children: []
          },
          {
            nodeType: 'element',
            tag: 'view',
            style: { backgroundColor: '#4caf50' },
            extend: { debug: true },
            layoutRect: { x: 260, y: 40, width: 200, height: 150 },
            children: []
          },
          {
            nodeType: 'element',
            tag: 'view',
            style: { backgroundColor: '#2196f3' },
            extend: { debug: true },
            layoutRect: { x: 480, y: 40, width: 200, height: 150 },
            children: []
          }
        ]
      };
      
      renderNode(rootNode);
      document.getElementById('info').textContent = '调试模式：绿色边框显示节点边界';
    };

    // 默认运行测试 1
    renderTest1();
  </script>
</body>
</html>
