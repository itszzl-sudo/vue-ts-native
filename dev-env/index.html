<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vue-ts-native 开发环境</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0e27;
      color: #fff;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #4fc3f7;
    }
    #app {
      width: 800px;
      margin: 0 auto;
    }
    canvas {
      display: block;
      width: 100%;
      border-radius: 12px;
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <h1>vue-ts-native 开发环境 (Vite + Canvas2D)</h1>
  <div id="app"></div>
  <script type="module" src="/main.ts"></script>
</body>
</html>
