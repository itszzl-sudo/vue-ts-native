<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Yoga 布局测试 - 终端日志版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
    }
    #terminal {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      background: #000;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 20px;
      min-height: 600px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.6;
    }
    .log-line { margin: 2px 0; }
    .log-info { color: #4ec9b0; }
    .log-success { color: #569cd6; font-weight: bold; }
    .log-error { color: #f44747; font-weight: bold; }
    .log-tree { color: #ce9178; }
    .separator { color: #808080; }
  </style>
</head>
<body>
  <div id="terminal"></div>

  <script type="module">
    import initYoga from 'https://cdn.jsdelivr.net/npm/yoga-wasm-web@0.3.3/dist/yoga-wasm-web.auto.js';

    const terminal = document.getElementById('terminal');
    let logs = [];

    function log(message, className = 'log-line') {
      logs.push({ message, className });
      const div = document.createElement('div');
      div.className = className;
      div.textContent = message;
      terminal.appendChild(div);
      terminal.scrollTop = terminal.scrollHeight;
    }

    async function test() {
      log('========================================', 'separator');
      log('开始测试 Yoga 布局引擎', 'log-info');
      log('========================================', 'separator');
      log('');

      try {
        log('[1/3] 加载 Yoga WASM...', 'log-info');
        const yoga = await initYoga();
        log('[1/3] ✅ Yoga WASM 加载成功', 'log-success');
        log('  - DIRECTION_LTR:', yoga.DIRECTION_LTR, 'log-tree');
        log('  - FLEX_DIRECTION_COLUMN:', yoga.FLEX_DIRECTION_COLUMN, 'log-tree');
        log('');

        log('[2/3] 创建布局树...', 'log-info');
        const root = yoga.Node.create();
        root.setWidth(760);
        root.setHeight(560);
        root.setFlexDirection(yoga.FLEX_DIRECTION_COLUMN);
        root.setPadding(yoga.EDGE_ALL, 20);
        root.setGap(yoga.GUTTER_ALL, 10);

        const child1 = yoga.Node.create();
        child1.setWidth(720);
        child1.setHeight(100);
        root.insert(child1, 0);

        const child2 = yoga.Node.create();
        child2.setFlexDirection(yoga.FLEX_DIRECTION_ROW);
        child2.setGap(yoga.GUTTER_ALL, 10);

        const child2_1 = yoga.Node.create();
        child2_1.setFlex(1);
        child2_1.setHeight(150);
        child2.insert(child2_1, 0);

        const child2_2 = yoga.Node.create();
        child2_2.setFlex(2);
        child2_2.setHeight(150);
        child2.insert(child2_2, 1);

        root.insert(child2, 1);
        log('[2/3] ✅ 布局树创建成功', 'log-success');
        log('');

        log('[3/3] 计算布局...', 'log-info');
        root.calculateLayout(760, 560, yoga.DIRECTION_LTR);
        log('[3/3] ✅ 布局计算完成', 'log-success');
        log('');

        log('=== 布局结果 ===', 'log-info');
        printLayoutTree(root, 'root', 0);
        log('');
        log('=== 测试完成 ===', 'log-success');

      } catch (error) {
        log('❌ 测试失败: ' + error, 'log-error');
        log(error.stack, 'log-error');
      }
    }

    function printLayoutTree(yogaNode, name, depth) {
      const layout = yogaNode.getComputedLayout();
      const indent = '  '.repeat(depth);
      
      log(`${indent}${name}`, 'log-tree');
      log(`${indent}  尺寸: ${Math.round(layout.width)} × ${Math.round(layout.height)}`, 'log-tree');
      log(`${indent}  位置: (${Math.round(layout.left)}, ${Math.round(layout.top)})`, 'log-tree');
      
      const childCount = yogaNode.getChildCount();
      if (childCount > 0) {
        log(`${indent}  子节点: ${childCount} 个`, 'log-tree');
        for (let i = 0; i < childCount; i++) {
          const child = yogaNode.getChild(i);
          printLayoutTree(child, `child[${i}]`, depth + 1);
        }
      }
    }

    test();
  </script>
</body>
</html>
