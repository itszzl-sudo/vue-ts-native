<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vue-ts-native Yoga + Canvas 2D 完整链路</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0e27;
      color: #fff;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #4fc3f7;
    }
    .container {
      width: 1000px;
      margin: 0 auto;
      display: flex;
      gap: 20px;
    }
    .canvas-box {
      flex: 2;
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
    }
    .info-box {
      flex: 1;
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
    }
    canvas {
      display: block;
      width: 100%;
      border-radius: 8px;
      background: #f5f5f5;
    }
    h3 {
      color: #4fc3f7;
      margin-bottom: 10px;
    }
    .node-tree {
      font-family: monospace;
      font-size: 12px;
      background: #0a0e27;
      padding: 10px;
      border-radius: 6px;
      max-height: 500px;
      overflow-y: auto;
    }
    .node-item {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <h1>vue-ts-native Yoga 布局 + Canvas 2D 渲染完整链路</h1>
  
  <div class="container">
    <div class="canvas-box">
      <canvas id="main-canvas" width="600" height="600"></canvas>
    </div>
    
    <div class="info-box">
      <h3>节点树</h3>
      <div class="node-tree" id="node-tree"></div>
    </div>
  </div>

  <!-- 引入 Yoga WebAssembly -->
  <script src="https://cdn.jsdelivr.net/npm/yoga-wasm-web@0.3.3/dist/yoga-wasm-web.auto.js"></script>
  
  <script type="module">
    import initYoga from 'https://cdn.jsdelivr.net/npm/yoga-wasm-web@0.3.3';

    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    
    canvas.width = 600 * dpr;
    canvas.height = 600 * dpr;
    ctx.scale(dpr, dpr);

    let yoga = null;

    // 初始化 Yoga
    async function init() {
      yoga = await initYoga();
      console.log('✅ Yoga 初始化成功');
      
      // 运行测试
      runYogaLayoutTest();
    }

    // 运行 Yoga 布局测试
    function runYogaLayoutTest() {
      // 创建 Yoga 节点树
      const root = yoga.Node.create();
      root.setWidth(560);
      root.setHeight(560);
      root.setFlexDirection(yoga.FLEX_DIRECTION_COLUMN);
      root.setPadding(yoga.EDGE_ALL, 20);
      root.setGap(yoga.GUTTER_ALL, 10);

      // 子节点 1: 红色容器
      const child1 = yoga.Node.create();
      child1.setWidth(520);
      child1.setHeight(100);
      child1.setBackgroundColor('#f44336');
      child1.setBorder(yoga.EDGE_ALL, 2);
      child1.setBorderColor('#b71c1c');
      root.insert(child1, 0);

      // 子节点 2: 绿色圆角容器
      const child2 = yoga.Node.create();
      child2.setWidth(520);
      child2.setHeight(100);
      child2.setBackgroundColor('#4caf50');
      child2.setBorderRadius(20);
      root.insert(child2, 1);

      // 子节点 3: Flex 行布局
      const child3 = yoga.Node.create();
      child3.setFlexDirection(yoga.FLEX_DIRECTION_ROW);
      child3.setGap(yoga.GUTTER_ALL, 10);

      const child3_1 = yoga.Node.create();
      child3.setFlex(1);
      child3_1.setHeight(80);
      child3_1.setBackgroundColor('#2196f3');
      child3.insert(child3_1, 0);

      const child3_2 = yoga.Node.create();
      child3.setFlex(2);
      child3_2.setHeight(80);
      child3_2.setBackgroundColor('#ff9800');
      child3.insert(child3_2, 1);

      root.insert(child3, 2);

      // 计算布局
      root.calculateLayout(560, 560, yoga.DIRECTION_LTR);

      // 转换为 Canvas 可渲染的节点结构
      const canvasNodes = convertYogaToCanvasNodes(root);
      
      // 渲染
      renderCanvas(canvasNodes);
      renderNodeTree(canvasNodes);
    }

    // 转换 Yoga 节点为 Canvas 节点结构
    function convertYogaToCanvasNodes(yogaNode, offsetX = 0, offsetY = 0) {
      const layout = yogaNode.getComputedLayout();
      
      const node = {
        nodeType: 'element',
        tag: 'view',
        style: {
          backgroundColor: yogaNode.backgroundColor || 'transparent',
          borderWidth: String(yogaNode.getBorder(yoga.EDGE_LEFT) || 0),
          borderColor: yogaNode.borderColor || 'transparent',
          borderRadius: String(yogaNode.borderRadius || 0)
        },
        layoutRect: {
          x: layout.left + offsetX,
          y: layout.top + offsetY,
          width: layout.width,
          height: layout.height
        },
        children: [],
        extend: {}
      };

      // 递归处理子节点
      const childCount = yogaNode.getChildCount();
      for (let i = 0; i < childCount; i++) {
        const child = yogaNode.getChild(i);
        node.children.push(
          convertYogaToCanvasNodes(child, node.layoutRect.x, node.layoutRect.y)
        );
      }

      return node;
    }

    // Canvas 渲染
    function renderCanvas(node) {
      clearCanvas();
      renderNode(node);
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, 600, 600);
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(0, 0, 600, 600);
    }

    function renderNode(node) {
      const { x, y, width, height } = node.layoutRect;
      
      if (width === 0 || height === 0) return;
      
      ctx.save();
      
      // 背景
      if (node.style.backgroundColor && node.style.backgroundColor !== 'transparent') {
        ctx.fillStyle = node.style.backgroundColor;
        
        const radius = Number(node.style.borderRadius) || 0;
        if (radius > 0) {
          drawRoundRect(ctx, x, y, width, height, radius);
          ctx.fill();
        } else {
          ctx.fillRect(x, y, width, height);
        }
      }
      
      // 边框
      const borderWidth = Number(node.style.borderWidth) || 0;
      if (borderWidth > 0 && node.style.borderColor !== 'transparent') {
        ctx.strokeStyle = node.style.borderColor;
        ctx.lineWidth = borderWidth;
        ctx.strokeRect(x, y, width, height);
      }
      
      ctx.restore();
      
      // 渲染子节点
      node.children.forEach(child => renderNode(child));
    }

    function drawRoundRect(ctx, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + width - r, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + r);
      ctx.lineTo(x + width, y + height - r);
      ctx.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
      ctx.lineTo(x + r, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // 渲染节点树信息
    function renderNodeTree(node, depth = 0) {
      const treeDiv = document.getElementById('node-tree');
      const indent = '  '.repeat(depth);
      
      const div = document.createElement('div');
      div.className = 'node-item';
      div.innerHTML = `${indent}&lt;${node.tag}&gt; ${Math.round(node.layoutRect.width)}×${Math.round(node.layoutRect.height)} @ (${Math.round(node.layoutRect.x)}, ${Math.round(node.layoutRect.y)})`;
      
      treeDiv.appendChild(div);
      
      node.children.forEach(child => renderNodeTree(child, depth + 1));
    }

    // 启动
    init();
  </script>
</body>
</html>
